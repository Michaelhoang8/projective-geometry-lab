[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projective-geometry-lab"
version = "1.0.0"
description = "Normalized homography estimation and bounded deterministic RANSAC"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[tool.setuptools.packages.find]
where = ["src"]
